[project]
name = "creditrisk-test"
version = "1.0.0"
description = "Stratégie de test d'un système d'estimation du risque de défaut (prototype)"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
filterwarnings = [
    "error::DeprecationWarning:app.*",
    # Avertissement interne de Starlette sur son client de test, sans effet sur les tests.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.coverage.run]
source = ["app", "ml"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 90
exclude_also = [
    "if __name__ == .__main__.:",
    "def main\\(",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "outils_rapport"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PT", "RUF"]
ignore = [
    "RUF001",  # caractères typographiques français (’, «, ») volontaires
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/exigences.py" = ["E501"]
"ml/reference.py" = ["E501"]
